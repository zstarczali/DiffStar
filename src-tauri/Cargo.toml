[package]
name = "diffstar"
version = "0.2.2"
description = "DiffStar - file and folder compare with visual diff, merge and AI explanations"
edition = "2021"

[lib]
name = "diffstar_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json"] }
base64 = "0.22"
arboard = { version = "3", default-features = false }
similar = "2"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico"] }
sha2 = "0.10"
trash = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
